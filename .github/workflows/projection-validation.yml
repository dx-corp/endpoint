name: Projection validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Inspect projection state
        id: projection
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f .repository-projection.json ]]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'present=false' >> "$GITHUB_OUTPUT"
          unexpected="$(find . -mindepth 1 \( -path './.git' -o -path './.github' \) -prune -o \( -path './README.md' -o -path './SECURITY.md' -o -path './CONTRIBUTING.md' -o -path './CODEOWNERS' \) -prune -o -print)"
          if [[ -n "$unexpected" ]]; then
            printf 'Projection payload exists without provenance:\n%s\n' "$unexpected" >&2
            exit 1
          fi
          echo 'Projection payload has not landed; validated the destination-owned bootstrap tree.'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.projection.outputs.present == 'true'
        with:
          node-version: 22.23.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.projection.outputs.present == 'true'
        with:
          python-version: 3.12.12
      - name: Install the pinned Rust toolchain
        if: steps.projection.outputs.present == 'true'
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal
          rustc +1.95.0 --version
          cargo +1.95.0 --version
      - name: Validate the projected distribution
        if: steps.projection.outputs.present == 'true'
        env:
          RUSTUP_TOOLCHAIN: 1.95.0
        run: |
          set -euo pipefail
          tree="$RUNNER_TEMP/endpoint-projection"
          mkdir -p "$tree"
          git archive --format=tar HEAD | tar -xf - -C "$tree"
          test -f "$tree/LICENSE"
          test -f "$tree/scripts/projections/distribution-validation.mjs"
          node "$tree/scripts/projections/distribution-validation.mjs" --name endpoint --target "$tree"
