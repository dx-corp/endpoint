# Rules run, on the computer, on the content of each AI skill (its SKILL.md),
# custom agent file and plugin manifest the ai_tools collector finds, with
# YARA-X. A finding carries the file's SHA-256 and the ids of the rules it
# matched, never the content. A test compiles every rule file and checks that
# the rules in it are exactly the ids declared for it here.
#
# id: the rule name, as findings report it.
# engine: yara.
# file: the rule file, under rules/ai/.
#
# skill-scanner/: the YARA rules of Cisco AI Defense skill-scanner
# (https://github.com/cisco-ai-defense/skill-scanner, Apache-2.0; LICENSE and
# README.md beside them), unchanged. Its LLM, Cisco API, signature and Python
# analyzers are not run.
ai_content_rules = [
  # gitleaks/: the default rules of gitleaks v8.30.1 (MIT; LICENSE and
  # README.md beside them), unchanged. A gitleaks row names the file and no
  # id: every rule in it that runs is declared, by its gitleaks id. They
  # run on the same files and also on each MCP server entry of a config.
  { engine = "gitleaks", file = "gitleaks/gitleaks.toml" },
  { id = "autonomy_abuse_generic", engine = "yara", file = "skill-scanner/autonomy_abuse_generic.yara" },
  { id = "SUSP_Lnx_EncodedShell_DecodeExec_Sep26", engine = "yara", file = "skill-scanner/behavior_chain_detection.yara" },
