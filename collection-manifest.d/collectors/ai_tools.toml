order = 90
id = "ai_tools"
group = "ai_tools"
title = "AI coding tools and MCP servers"
what = "Which AI coding tools are installed (names), which MCP servers each client has configured (client, server name, where it is configured, transport), which agent skills or instructions exist (client, kind, name, source), and which declared AI editor and browser extensions (ai_extensions) are installed in VS Code and Chrome, by id, on this computer, inside up to 16 running containers (Docker, podman including rootless, containerd, CRI-O), each read through its own root and marked with its image name when Docker records one, and on Windows inside WSL distributions as they start, marked with the distribution name. A WSL distribution that has not been read is reported as not scanned, with why, and so is a declared config file over its read limit (by its fixed label). For each MCP server, what it runs: for a local server the package or image a known runner starts (npx, bunx, pnpm dlx, npm exec, uvx, pipx run, docker run) or else the program's file name; for a remote server only the URL's host name. AI tool configuration files and plugin manifests on each root are read locally, up to 64 KiB each, to derive these fields (MCP entries, enabled plugin names, package and host); their bodies are not sent. On Linux, each skill's SKILL.md, custom agent file and plugin manifest is read on the computer and checked against the declared ai_content_rules; only its SHA-256 and the ids of the rules it matched are sent. Each MCP server entry of a config is also checked against the vendored gitleaks secret rules, on Linux, Windows and in WSL and containers; only the ids of the rules it matched are sent, never the value. Arguments beyond that package name, environment variables, headers, URL paths, query strings, tokens and file bodies are never sent. On Linux, with the sensor running, the hosts each AI agent and each of its configured stdio MCP servers actually contacted (observed reach): the client, the server's package, a looked-up DNS name or a connected IP address, and the first and last hour it was seen; at most 1024 on a computer, each kept 30 days after it was last seen, and said to be truncated when the bound is reached. A server is recognized when its command line, read locally and not sent, resolves to a configured server's package. Never a URL, path, port or what was sent."
why = "AI tool governance: knowing which agents and servers run on company machines."
records = ["inventory.agent_clis", "inventory.mcp_servers", "inventory.agent_assets", "inventory.ai_location_coverage", "inventory.contacted_hosts", "inventory.contacted_hosts_truncated"]
capabilities = []
retention = "while_enrolled"
