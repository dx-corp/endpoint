# Each claim names the source fact or test that keeps it true.
[[never_collected]]
claim = "Command lines and arguments in recorded process events, including what an AI agent was asked or ran (attributing an event to an agent adds only the agent's name and session id)"
proof = "spool::write_value omits cmdline (test serialized_exec_omits_commands_even_when_a_rule_matched); inventory DeviceProcess has no cmdline or args field; agent_session::stamp adds only agent, a declared client name, and agent_session, a process key (tests a_script_an_agent_ran_adds_only_the_agent_and_its_session and a_program_outside_any_agent_is_not_attributed_and_gains_no_keys)"
[[never_collected]]
claim = "Raw file, document, message, skill, agent or plugin bodies, and credential file contents, in uploaded records"
proof = "file events contain metadata and selected derived fields; a credential file open is resolved from the fanotify event's descriptor to its path and the descriptor is closed unread, and credential_files finds the declared files with metadata calls only (filemon.rs cw_loop; credential_files.rs; tests every_declared_credential_is_named_by_its_path_and_a_near_miss_is_not and a_credential_open_is_access_and_a_watched_change_is_persistence); FIM and script monitoring read bounded bodies locally for DeviceFIMEntry.sha256 and script_sha256; AI skill, agent and plugin manifest files are read on the computer (up to 256 KiB each) to hash and check, and only the SHA-256 and matched rule ids are kept (ai_discovery/content_scan.rs; test a_planted_malicious_skill_is_flagged_by_rule_id_and_hash_only); raw bodies are not serialized"
[[never_collected]]
claim = "MCP server arguments beyond the package name, environment variables, headers, URL paths, query strings and tokens, and anything an AI agent or MCP server sent or received beyond the host it contacted; skill, agent or plugin file contents (only their SHA-256 and the ids of declared rules they matched); AI agent settings values; and installed editor or browser extensions other than the declared ai_extensions ids, in uploaded records"
proof = "bounded local config and plugin manifest reads derive DeviceMCPServer client, name, source, transport, location, package, host, matched_rules, where matched_rules are the ids of declared gitleaks ai_content_rules the entry's own text matched and never the value or a hash of it (ai_discovery/secret_rules.rs; tests a_token_in_an_mcp_entry_is_reported_by_rule_id_only and a_forged_mcp_rule_id_from_a_child_scan_is_dropped); package is a package spec, image reference or program file name and host a URL host name (ai_discovery/mcp_identity.rs stdio_package and remote_host, and on macOS MCPIdentity.swift with the same cases; tests a_known_runner_reports_only_its_package_spec, an_mcp_identity_never_carries_a_secret and MCPIdentityTests discoveryCarriesIdentityWithoutSecrets); DeviceAgentAsset is client, kind, name, source, location, sha256, matched_rules, where matched_rules are declared ai_content_rules ids and a container or WSL scan's are filtered to them (ai_discovery.rs keep_valid_content_facts; test a_skill_hash_and_its_matched_rule_ids_reach_the_check_in_and_forged_ones_do_not; test a_child_scan_keeps_only_a_hex_hash_and_declared_rule_ids); collect_agent_discovery never executes a CLI; linux_posture_ai reports only declared reasons, rule ids and an observation hash (test claude_code_bypass_mode_and_allow_all_shell_are_findings); every location is opened with no symlink anywhere below the home and a linked home is not scanned (sync.rs open_agent_directory, read_agent_config_beneath; tests a_linked_parent_below_the_home_is_never_followed and a_linked_home_is_not_scanned); an editor or browser extension is named only when its directory matches a declared ai_extensions id (ai_discovery/extensions.rs; tests an_editor_extension_is_named_by_its_declared_id_and_no_other_is and only_declared_ai_extensions_are_named_and_a_linked_profile_is_not_followed); DeviceContactedHost is client, mcp_package, host, first_seen_unix, last_seen_unix, where host is a DNS name or IP address and never a URL (contacted_hosts.rs dns_host and address_host; tests hosts_are_names_or_addresses_never_urls_or_local_addresses and the_kept_file_restores_first_sightings_and_drops_forged_rows)"
[[never_collected]]
claim = "Password and password-hash fields from account records"
proof = "DeviceUser is name, uid, admin, shell, source; posture evidence is a hash of what was read, with redactions declared"
[[never_collected]]
claim = "Keystrokes, screen contents, camera or microphone"
proof = "no collector opens input, display, video or audio devices (test no_collector_touches_input_display_or_media_devices)"
[[never_collected]]
claim = "Web pages, chats or what you typed into them (domain names looked up are recorded; page contents are not)"
proof = "dns events carry pid, uid, comm, the queried name and matched rule names; connect events carry addresses and ports"
