# Rules run, on the computer, on the content of each AI skill (its SKILL.md),
# custom agent file and plugin manifest the ai_tools collector finds, with
# YARA-X. A finding carries the file's SHA-256 and the ids of the rules it
# matched, never the content. A test compiles every rule file and checks that
# the rules in it are exactly the ids declared for it here.
