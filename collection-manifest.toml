# id: the rule name, as findings report it.
# engine: yara.
# file: the rule file, under rules/ai/.
#
# skill-scanner/: the YARA rules of Cisco AI Defense skill-scanner
# (https://github.com/cisco-ai-defense/skill-scanner, Apache-2.0; LICENSE and
