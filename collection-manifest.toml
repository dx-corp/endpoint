  { id = "system_manipulation_generic", engine = "yara", file = "skill-scanner/system_manipulation_generic.yara" },
  { id = "tool_chaining_abuse_generic", engine = "yara", file = "skill-scanner/tool_chaining_abuse_generic.yara" },
]

# group: checks, inventory, ai_tools, security_events or agent.
# records: the check-in sections or event kinds the collector produces.
# capabilities: static build capabilities that declare supported collectors.
# retention: while_enrolled (the device record: current state is replaced on
# check-in, and retirement/disposal leaves a device tombstone) or
# telemetry_window (raw events, kept for the server's telemetry window).
[[collectors]]
id = "posture_checks"
group = "checks"
title = "Security settings"
what = "Whether disk encryption, screen lock, OS and automatic updates, firewall, remote access, endpoint protection and a password manager are in place, and whether AI coding agents (Claude Code, Codex, Gemini CLI, Cursor CLI) are set to act without asking, each as pass, fail or unknown with a short reason and a hash of the evidence read. For AI agents the reason names the setting (from ai-agent-approval.toml); the setting's value, the file's path and the account are not sent. On Linux, whether a pickle model file in the Hugging Face, Ollama or LM Studio cache imports a function that can run code when loaded, found by reading its pickle instructions without loading it; only the result is sent, never file names, paths or contents. AI agent and model file results are reported and do not affect secure-device access unless the workspace policy turns that on. Settings are read; their contents are not copied."
why = "Workstation controls in SOC 2 and ISO 27001 ask that company computers are encrypted, locked, patched and protected."
records = ["posture.checks", "posture.findings", "posture.coverage"]
capabilities = ["posture_reporting"]
retention = "while_enrolled"
[[collectors]]
id = "hardening"
group = "checks"
title = "System hardening facts"
what = "Read-only facts about kernel parameters, boot settings, service configuration and Kubernetes components, taken from a fixed list of targets, reported as normalized states and hashes."
why = "Configuration benchmarks (CIS-style) that controls reference."
records = ["hardening.observations"]
capabilities = ["security_configuration_assessment", "linux_boot_trust_posture"]
retention = "while_enrolled"
[[collectors]]
id = "os_and_hardware"
group = "inventory"
title = "Operating system and hardware"
what = "OS name and version, kernel, architecture, CPU model and count, memory and disk totals, uptime, virtualization and network interface names and states. No addresses."
why = "The device record every control refers to."
records = ["os_info"]
capabilities = ["system_inventory"]
retention = "while_enrolled"
[[collectors]]
id = "software"
group = "inventory"
title = "Installed software and services"
what = "Package names, versions and architectures from the system package manager; service names and states; known vulnerability matches by package and version."
why = "Patch management and vulnerability controls."
records = ["inventory.package_manager", "inventory.packages", "inventory.services", "inventory.vulnerabilities", "inventory.collected_at", "inventory.collection_source"]
capabilities = ["system_inventory", "rootcheck"]
retention = "while_enrolled"
[[collectors]]
id = "accounts"
group = "inventory"
title = "User accounts and groups"
what = "Account names, numeric ids, whether an account is an administrator, and its login shell; group names. No passwords or password hashes."
why = "Access control: who can sign in to the computer and with what rights."
records = ["inventory.users", "inventory.groups"]
capabilities = ["system_inventory"]
retention = "while_enrolled"
[[collectors]]
id = "network_exposure"
group = "inventory"
title = "Listening ports and containers"
what = "Protocol, port and state of listening sockets; container ids, names, images, states and runtimes; cloud provider, instance id and region when the machine runs in a cloud."
why = "Exposure and asset inventory controls."
records = ["inventory.listening_ports", "inventory.containers", "inventory.cloud_provider", "inventory.cloud_instance_id", "inventory.cloud_region"]
capabilities = ["container_inventory", "cloud_inventory"]
retention = "while_enrolled"
[[collectors]]
id = "running_programs"
group = "inventory"
title = "Running programs"
what = "For each process: id, program name, executable path, owning user id and state. Not the command line or arguments."
why = "Endpoint protection and unauthorized software controls."
records = ["inventory.processes"]
capabilities = ["system_inventory"]
retention = "while_enrolled"
[[collectors]]
id = "file_integrity"
group = "inventory"
title = "File integrity baselines"
what = "For files in selected system locations: path, SHA-256 when readable within the size limit, size, permissions, modification time and status. File bodies are read locally for hashes and selected configuration values; raw bodies are not uploaded."
why = "Change detection on system configuration."
records = ["inventory.fim", "inventory.sca"]
capabilities = ["file_integrity"]
retention = "while_enrolled"
[[collectors]]
id = "ai_tools"
group = "ai_tools"
title = "AI coding tools and MCP servers"
what = "Which AI coding tools are installed (names), which MCP servers each client has configured (client, server name, where it is configured, transport), which agent skills or instructions exist (client, kind, name, source), and which declared AI editor and browser extensions (ai_extensions) are installed in VS Code and Chrome, by id, on this computer, inside up to 16 running containers (Docker, podman including rootless, containerd, CRI-O), each read through its own root and marked with its image name when Docker records one, and on Windows inside WSL distributions as they start, marked with the distribution name. A WSL distribution that has not been read is reported as not scanned, with why, and so is a declared config file over its read limit (by its fixed label). For each MCP server, what it runs: for a local server the package or image a known runner starts (npx, bunx, pnpm dlx, npm exec, uvx, pipx run, docker run) or else the program's file name; for a remote server only the URL's host name. AI tool configuration files and plugin manifests on each root are read locally, up to 64 KiB each, to derive these fields (MCP entries, enabled plugin names, package and host); their bodies are not sent. On Linux, each skill's SKILL.md, custom agent file and plugin manifest is read on the computer and checked against the declared ai_content_rules; only its SHA-256 and the ids of the rules it matched are sent. Arguments beyond that package name, environment variables, headers, URL paths, query strings, tokens and file bodies are never sent."
why = "AI tool governance: knowing which agents and servers run on company machines."
records = ["inventory.agent_clis", "inventory.mcp_servers", "inventory.agent_assets", "inventory.ai_location_coverage"]
capabilities = []
retention = "while_enrolled"
[[collectors]]
id = "process_events"
group = "security_events"
title = "Program starts, scripts and exits"
what = "When a program starts or ends: program name, executable path, parent programs, working directory, container, and the rules it matched. The command line is read locally to evaluate rules and is omitted from recorded events. Scripts record the interpreter, script path and SHA-256 of the script body read locally; the raw script body is not uploaded. A program that runs under a declared AI agent (ai_agent_processes), or is one, also records the agent's name and its session id (the agent process's key: boot id, process id and start time)."
why = "Detecting and investigating attacks (endpoint detection)."
records = ["exec", "script", "fork", "exit", "task_exit"]
capabilities = ["segment_upload"]
retention = "telemetry_window"
[[collectors]]
id = "network_events"
group = "security_events"
title = "Network connections and DNS lookups"
what = "Outbound connections (program, source and destination address and port), socket state changes, network interface changes, and the domain names programs look up with the program that asked and the names of any assigned rules the lookup matched. A connection or lookup made by a program that runs under a declared AI agent, or is one, also records the agent's name and its session id. Not page contents, messages or what was sent."
why = "Detecting command-and-control, data exfiltration and DNS tunnelling."
records = ["connect", "socket", "netif", "dns"]
capabilities = ["segment_upload", "policy_dns"]
retention = "telemetry_window"
[[collectors]]
id = "file_events"
group = "security_events"
title = "Changes in watched system locations"
what = "The path, operation and program for changes under a fixed list of persistence and configuration locations, and the AI agent's name and session id when the program runs under a declared one. File bodies are not uploaded."
why = "Detecting persistence (startup items, cron, shell profiles) and tampering."
records = ["file"]
capabilities = ["segment_upload"]
retention = "telemetry_window"
[[collectors]]
id = "memory_and_privilege_events"
group = "security_events"
title = "Memory, privilege and kernel signals"
what = "Anonymous memory files, io_uring use, credential changes to root, selected system calls with their numeric arguments and memory-protection transitions, and eBPF program changes. Program name and id only; no file contents or command lines."
why = "Detecting in-memory attacks, privilege escalation and sensor tampering."
records = ["memfd", "iouring", "iouring_op", "cred", "security", "bpfcheck"]
capabilities = ["segment_upload"]
retention = "telemetry_window"
[[collectors]]
id = "enforcement"
group = "agent"
title = "What the agent blocked or stopped"
what = "When a signed rule blocks a program from starting or stops a running one: the program, the rule name and the outcome. Nothing is blocked unless the workspace assigned a rule that blocks."
why = "Evidence that endpoint protection acted, and a record of every action taken on this computer."
records = ["deny", "kill"]
capabilities = ["rules_sync"]
retention = "telemetry_window"
[[collectors]]
id = "health"
group = "agent"
title = "Agent health"
what = "How many events were kept or dropped, upload backlog and errors, and the agent version."
why = "Knowing the evidence stream is complete; a device that stopped reporting is a finding, not a pass."
records = ["health", "check_in.health", "check_in.capabilities"]
capabilities = ["segment_upload"]
retention = "while_enrolled"

# Each claim names the source fact or test that keeps it true.
[[never_collected]]
claim = "Command lines and arguments in recorded process events, including what an AI agent was asked or ran (attributing an event to an agent adds only the agent's name and session id)"
proof = "spool::write_value omits cmdline (test serialized_exec_omits_commands_even_when_a_rule_matched); inventory DeviceProcess has no cmdline or args field; agent_session::stamp adds only agent, a declared client name, and agent_session, a process key (tests a_script_an_agent_ran_adds_only_the_agent_and_its_session and a_program_outside_any_agent_is_not_attributed_and_gains_no_keys)"
[[never_collected]]
claim = "Raw file, document, message, skill, agent or plugin bodies in uploaded records"
proof = "file events contain metadata and selected derived fields; FIM and script monitoring read bounded bodies locally for DeviceFIMEntry.sha256 and script_sha256; AI skill, agent and plugin manifest files are read on the computer (up to 256 KiB each) to hash and check, and only the SHA-256 and matched rule ids are kept (ai_discovery/content_scan.rs; test a_planted_malicious_skill_is_flagged_by_rule_id_and_hash_only); raw bodies are not serialized"
[[never_collected]]
claim = "MCP server arguments beyond the package name, environment variables, headers, URL paths, query strings and tokens; skill, agent or plugin file contents (only their SHA-256 and the ids of declared rules they matched); AI agent settings values; and installed editor or browser extensions other than the declared ai_extensions ids, in uploaded records"
proof = "bounded local config and plugin manifest reads derive DeviceMCPServer client, name, source, transport, location, package, host; package is a package spec, image reference or program file name and host a URL host name (ai_discovery/mcp_identity.rs stdio_package and remote_host, and on macOS MCPIdentity.swift with the same cases; tests a_known_runner_reports_only_its_package_spec, an_mcp_identity_never_carries_a_secret and MCPIdentityTests discoveryCarriesIdentityWithoutSecrets); DeviceAgentAsset is client, kind, name, source, location, sha256, matched_rules, where matched_rules are declared ai_content_rules ids and a container or WSL scan's are filtered to them (ai_discovery.rs keep_valid_content_facts; test a_skill_hash_and_its_matched_rule_ids_reach_the_check_in_and_forged_ones_do_not; test a_child_scan_keeps_only_a_hex_hash_and_declared_rule_ids); collect_agent_discovery never executes a CLI; linux_posture_ai reports only declared reasons, rule ids and an observation hash (test claude_code_bypass_mode_and_allow_all_shell_are_findings); every location is opened with no symlink anywhere below the home and a linked home is not scanned (sync.rs open_agent_directory, read_agent_config_beneath; tests a_linked_parent_below_the_home_is_never_followed and a_linked_home_is_not_scanned); an editor or browser extension is named only when its directory matches a declared ai_extensions id (ai_discovery/extensions.rs; tests an_editor_extension_is_named_by_its_declared_id_and_no_other_is and only_declared_ai_extensions_are_named_and_a_linked_profile_is_not_followed)"
[[never_collected]]
claim = "Password and password-hash fields from account records"
proof = "DeviceUser is name, uid, admin, shell, source; posture evidence is a hash of what was read, with redactions declared"
[[never_collected]]
claim = "Keystrokes, screen contents, camera or microphone"
proof = "no collector opens input, display, video or audio devices (test no_collector_touches_input_display_or_media_devices)"
[[never_collected]]
claim = "Web pages, chats or what you typed into them (domain names looked up are recorded; page contents are not)"
proof = "dns events carry pid, uid, comm, the queried name and matched rule names; connect events carry addresses and ports"

# What the agent keeps on the computer.
[[local]]
path = "/var/lib/merlin"
holds = "The event spool: finished segments wait here until the server accepts them, then they are deleted; segments the server refuses for good move to quarantine/ and are never uploaded."
[[local]]
path = "/etc/merlin"
holds = "The device credential (0600, root) and the signed rules the workspace assigned."
