# The collection manifest of the Deixic Endpoint agent: what it collects, what
# it never collects, where it keeps things on the computer and how long the
# server keeps them. This file is the one declaration. The Linux agent compiles
# it in (merlin/build.rs) and prints it with `merlin manifest`; its tests tie
# every collector, record and never-claim to the code. The local screen and
# the transparency page render from it, so what people read is what the agent
# does.

# Set by the release; pull requests never change it. Main holds 0, a
# development build; packaging/stamp-manifest-version.sh writes the release's
# number here and into the macOS Manifest.swift before a release build.
manifest_version = 0

# The system journal's share; per-event details are debug level and off by default.
journal = "The system journal (journalctl -u merlin) carries health and errors only: starts, sensor attach, upload results, enforcement actions by rule name. Per-event details are debug level and off by default."

# Inventory record kinds, as the check-in's `inventory` object names them
# (field names of DeviceInventory in merlin/src/sync.rs; a test checks this).
inventory_fields = [
  "collected_at",
  "package_manager",
  "cloud_provider",
  "cloud_instance_id",
  "cloud_region",
  "packages",
  "services",
  "users",
  "groups",
  "listening_ports",
  "containers",
  "processes",
  "fim",
  "sca",
  "vulnerabilities",
  "agent_clis",
  "mcp_servers",
  "agent_assets",
  "ai_location_coverage",
  "collection_source",
]

# Every telemetry event kind a Linux monitor writes to the spool (a test
# checks the sources against this list).
event_kinds = [
  "exec",
  "script",
  "fork",
  "exit",
  "task_exit",
