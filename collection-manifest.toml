]

# Where the ai_tools collector looks, one row per location. The Linux agent
# compiles this list in and walks it in this order; the Windows and macOS
# collectors and the server's accepted source labels are tested against it.
#
# client: the AI client the finding belongs to.
# kind: cli (an executable name looked up in the fixed bin directories),
#   config, skill, agent, plugin or extension; or model, a local model cache
#   the posture check model_files_unsafe_pickle reads (Linux only; not AI tool
#   inventory, and it sends no source label).
# path: relative to each user's home (scope user) or to each visited project
#   directory (scope project), or an absolute path on the computer (scope
#   system). The source label a finding carries is this path, with "project/"
#   in front for project scope and "system" in front for system scope.
# format: how the file or directory is read.
#   executable        a regular executable file with this name; a symlink to
#                     one counts (only the name is reported)
#   json              a JSON file; MCP servers are the entries under mcp_keys;
#                     plugins_key names an object of plugin name -> true
#   toml              a TOML file; MCP servers are its [mcp_servers.<name>] tables
#   codex-toml        toml, opened with no symlink anywhere below the home, and
#                     plugins.<name> tables with enabled = true are plugins
#   skill-dir         each child directory that holds a regular SKILL.md
#   md                each regular *.md file, named by its stem
#   js-ts             each regular *.js or *.ts file, named by its stem
#   plugin-dir        each child directory; mcp_files inside it are read for
#                     MCP servers (label <path>/*/<file>)
#   gemini-extension  each child directory with a regular gemini-extension.json,
#                     read for MCP servers (label <path>/*/gemini-extension.json)
#   cursor-agent      md, opened with no symlink anywhere below the home and at
#                     most 64 KiB
#   cursor-plugin     each child directory whose plugin.json or
#                     .cursor-plugin/plugin.json names it, opened with no
#                     symlink anywhere below the home
#   claude-plugin-cache Claude Code's plugin cache, <marketplace>/<plugin>/<version>/:
#                     each plugin directory is a plugin; mcp_files in a version
#                     are read for MCP servers (label <path>/*/<file>), as is
#                     an inline mcpServers map in .claude-plugin/plugin.json
#                     (label <path>/*/.claude-plugin/plugin.json), and each
#                     skills/<name> with a regular SKILL.md is a skill named
#                     <plugin>:<name> (label <path>/*/skills); a version marked
#                     .orphaned_at is skipped; opened with no symlink anywhere
#                     below the home, at most 256 directories per scan
#   hf-hub            Hugging Face's hub cache: each <repo>/snapshots/<revision>
#                     entry, a link of the form ../../blobs/<hex> resolved
#                     lexically to the repo's blobs directory and opened with no
#                     symlink anywhere below the home; pickle files are walked
#                     opcode by opcode, never loaded
#   model-dir         each pickle file below the directory, opened with no
#                     symlink anywhere below the home, walked the same way
#   editor-extensions each child directory named <publisher>.<name>-<version>
#                     whose <publisher>.<name> is a declared vscode-marketplace
#                     ai_extensions id, compared without case as the editor
#                     does, is that extension; no other extension is named
#   chromium-extensions each profile directory (Default or Profile <n>, at most
#                     16) is read for Extensions/<id> directories whose id is
#                     a declared chrome-web-store ai_extensions id; no other
#                     extension is named
# scope: user, project or system. A system path is read once per computer
#   (and once per container root), opened with no symlink anywhere on it;
#   system rows are json configs and name linux or macos platforms.
# platforms: where the location applies; all three when absent.
# max_bytes: a user config row's read limit in bytes, 64 KiB when absent. A
#   file over its limit is not read; the inventory's ai_location_coverage
#   lists it (its source label) as not_scanned with reason too_large.
