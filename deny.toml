[graph]
all-features = true
# The targets this workspace ships: the Linux agent and sync server, and the
# Windows collector. Bans below are judged on these graphs.
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
  "x86_64-pc-windows-gnu",
  "aarch64-pc-windows-gnullvm",
]

[advisories]
version = 2
yanked = "deny"
ignore = [
  { id = "RUSTSEC-2025-0141", reason = "bincode 2.0.1 remains unmaintained through merlin -> yara-x 1.22.1, with no patched version. Automated re-review on 2026-11-18 verified the unchanged bundled-rule compiler and bounded scanner paths, the engine's internal globals encoding/decoding, and current yara-x 1.23.0 still requiring bincode 2.0.1. Fresh cargo-deny advisory scan passed with this explicit maintenance acceptance; no native behavior or arbitrary-input safety is inferred. Exact fresh review and limits: docs/security/endpoint-bincode-maintenance-review.md. This short renewal admits only maintenance risk pending a qualified upstream serializer replacement or another review; vulnerability and yanked checks remain enforced. expires: 2026-11-21" },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]
private = { ignore = true }

[bans]
multiple-versions = "allow"
wildcards = "allow"
deny = [
  # The Windows collector checks in over the OS TLS stack (schannel) through
  # ureq; native-tls is allowed only there, and OpenSSL stays banned.
  { name = "native-tls", wrappers = ["ureq"], reason = "TLS must use rustls, or schannel through ureq on Windows, so builds do not depend on host OpenSSL" },
  # cargo-deny judges one feature-unified graph, where native-tls (Windows
  # only) appears to reach OpenSSL on Linux. No shipped target builds it;
  # components/merlin.yaml checks that with cargo tree per Linux target.
  { name = "openssl", wrappers = ["native-tls"], reason = "TLS must use rustls so builds do not depend on host OpenSSL" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
