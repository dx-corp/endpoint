[package]
name = "merlin"
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[dependencies]
merlin-common = { path = "../merlin-common" }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = { package = "serde_norway", version = "0.9.42" }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
ed25519-dalek = "2"
base64 = "0.23"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"

# The eBPF loader, fanotify/netlink syscalls, the local screen and the sync
# client are Linux only so far; the crate also builds for Windows without
# them (and without ring's C build, so the Windows check needs no C compiler).
[target.'cfg(target_os = "linux")'.dependencies]
ureq = { version = "3", default-features = false, features = ["rustls"] }
aya = { version = "0.13", features = ["async_tokio"] }
nix = { version = "0.29", features = ["dir", "signal"] }
libc = "0.2"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29"] }
# Runs the vendored skill-scanner YARA rules (rules/ai/) on AI skill, agent
# and plugin files; no YARA modules are needed, so none are built.
yara-x = { version = "=1.22.1", default-features = false, features = ["constant-folding", "exact-atoms", "fast-regexp"] }

# Windows discovery's handle-verified reads (windows_discovery/handle_fs.rs)
# and the posture and process reads (windows_host.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
] }
# Check-in over Windows' own TLS (schannel) and certificate store.
ureq = { version = "3", default-features = false, features = ["native-tls-no-default"] }

[build-dependencies]
toml = "0.8"
