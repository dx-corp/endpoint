[package]
name = "merlin"
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[dependencies]
merlin-common = { path = "../merlin-common" }
aya = { version = "0.13", features = ["async_tokio"] }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
ed25519-dalek = "2"
base64 = "0.23"
ureq = { version = "3", default-features = false, features = ["rustls"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
nix = { version = "0.29", features = ["dir", "signal"] }
anyhow = "1"
libc = "0.2"
log = "0.4"
env_logger = "0.11"
