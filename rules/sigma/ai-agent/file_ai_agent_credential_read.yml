title: AI Agent - Credential File Read
id: e268cc99-f4cc-446f-be6b-adb67bb78dba
status: experimental
description: A program that an AI coding agent started, or the agent itself, opened a declared credential file (cloud, SSH key, Kubernetes, GitHub CLI, netrc or Google Cloud credentials; credential_files in the collection manifest). The agent is the event's agent attribution; the file's contents are never read or sent. Detection only.
references:
    - https://attack.mitre.org/techniques/T1552/001/
    - https://attack.mitre.org/techniques/T1552/004/
author: Deixic
date: 2026-11-10
tags:
    - attack.credential-access
    - attack.t1552.001
    - attack.t1552.004
logsource:
    category: file_access
    product: linux
detection:
    selection:
        Agent|exists: true
        Credential|exists: true
    condition: selection
falsepositives:
    - A cloud, Kubernetes or GitHub command the agent ran on purpose reads its own credentials
level: medium
